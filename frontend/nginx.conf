# Повторяет dev-прокси из vite.config.ts:
#   /api/* -> backend:8000/*  (префикс /api срезается)
#   /lt/*  -> languagetool:8010/*
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# Docker can assign a new IP when a service is recreated. Re-resolve upstreams
# instead of keeping the address from nginx startup until its next reload.
upstream backend_api {
    zone backend_api 64k;
    server backend:8000 resolve;
}

upstream language_tool {
    zone language_tool 64k;
    server languagetool:8010 resolve;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # CSV-пачки описаний могут быть большими
    client_max_body_size 20m;

    # Поддерживать соединение с браузером во время долгого инференса
    keepalive_timeout 600s;
    send_timeout 600s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # /analyze ждет модель последовательно и может идти несколько минут
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /lt/ {
        proxy_pass http://language_tool/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
