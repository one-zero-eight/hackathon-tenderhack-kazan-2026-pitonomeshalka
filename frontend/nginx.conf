# Повторяет dev-прокси из vite.config.ts:
#   /api/* -> backend:8000/*  (префикс /api срезается)
#   /lt/*  -> languagetool:8010/*
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # CSV-пачки описаний могут быть большими
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # /analyze ждет модель последовательно и может идти несколько минут
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /lt/ {
        proxy_pass http://languagetool:8010/;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
